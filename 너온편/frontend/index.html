<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>너온편 : 너에게 온 편지</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Gmarket+Sans:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #faf6ef;
      --cream-dark: #f0e9dc;
      --cream-mid: #f5f0e8;
      --navy: #1a2744;
      --navy-mid: #243257;
      --navy-light: #2e4070;
      --gold: #b8973a;
      --gold-light: #d4af60;
      --text: #1a2744;
      --muted: #6b7280;
      --white: #ffffff;
      --border: rgba(26, 39, 68, 0.12);
      --radius: 16px;
      --shadow: 0 4px 24px rgba(26, 39, 68, 0.10);
      --shadow-lg: 0 12px 48px rgba(26, 39, 68, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      display: none;
      min-height: 100vh;
    }

    .page.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ─── HOME ─── */
    .home-hero {
      background: linear-gradient(160deg, var(--navy) 0%, var(--navy-mid) 55%, var(--navy-light) 100%);
      padding: 80px 24px 64px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .home-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 20% 80%, rgba(212, 165, 160, .15) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 20%, rgba(184, 151, 58, .10) 0%, transparent 50%);
      pointer-events: none;
    }

    .home-inner {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
    }

    .home-badge {
      display: inline-block;
      border: 1px solid rgba(184, 151, 58, .5);
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      padding: 6px 18px;
      border-radius: 999px;
      margin-bottom: 28px;
    }

    .home-title {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(28px, 6vw, 50px);
      font-weight: 700;
      color: var(--cream);
      line-height: 1.25;
      margin-bottom: 18px;
    }

    .home-title span {
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .home-sub {
      font-size: 15px;
      color: rgba(250, 246, 239, .7);
      margin-bottom: 52px;
    }

    .home-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      max-width: 720px;
      margin: 0 auto;
    }

    .home-card {
      background: rgba(250, 246, 239, .07);
      border: 1px solid rgba(184, 151, 58, .25);
      border-radius: var(--radius);
      padding: 26px 22px;
      cursor: pointer;
      text-align: left;
      transition: all .3s cubic-bezier(.34, 1.56, .64, 1);
      position: relative;
      overflow: hidden;
    }

    .home-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--gold);
      box-shadow: 0 20px 48px rgba(0, 0, 0, .3);
    }

    .card-emoji {
      font-size: 30px;
      margin-bottom: 12px;
      display: block;
    }

    .card-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--gold-light);
      font-weight: 700;
      margin-bottom: 5px;
    }

    .card-title {
      font-family: 'Gmarket Sans', sans-serif;
      font-size: 17px;
      font-weight: 500;
      color: var(--cream);
      margin-bottom: 7px;
    }

    .card-desc {
      font-size: 12px;
      color: rgba(250, 246, 239, .55);
      line-height: 1.6;
    }

    /* ─── WRITE LETTER ─── */
    .write-header {
      background: linear-gradient(160deg, var(--navy) 0%, var(--navy-mid) 100%);
      padding: 32px 24px;
      color: var(--cream);
      position: relative;
      margin-bottom: 32px;
    }

    .write-header h1 {
      font-family: 'Noto Serif KR', serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .write-header p {
      font-size: 13px;
      opacity: 0.85;
    }

    .write-container {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    /* ─── MODAL ─── */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--white);
      border-radius: var(--radius);
      padding: 40px 32px;
      max-width: 500px;
      width: 90%;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.4s ease;
    }

    .modal-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--navy);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      color: var(--text);
      transition: all 0.2s;
    }

    .form-group select:focus,
    .form-group input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(184, 151, 58, 0.1);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Noto Sans KR', sans-serif;
    }

    .btn-primary {
      background: var(--navy);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--navy-mid);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(26, 39, 68, 0.2);
    }

    .btn-secondary {
      background: var(--cream-dark);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--cream-mid);
    }

    /* ─── LETTER FORM ─── */
    .letter-box {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .letter-header {
      font-family: 'Noto Serif KR', serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--cream-dark);
    }

    textarea.letter-input {
      width: 100%;
      min-height: 300px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'Noto Serif KR', serif;
      font-size: 14px;
      resize: vertical;
      margin-bottom: 20px;
    }

    .letter-footer {
      font-family: 'Noto Serif KR', serif;
      font-size: 14px;
      color: var(--navy);
      text-align: right;
      line-height: 1.8;
      display: flex;
      justify-content: flex-end;
      gap: 4px;
    }

    .preview-info {
      background: rgba(184, 151, 58, 0.08);
      border-left: 3px solid var(--gold);
      padding: 12px 14px;
      border-radius: 0 8px 8px 0;
      font-size: 12px;
      color: var(--text);
      margin-bottom: 20px;
    }

    .submit-section {
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
    }

    .btn-submit {
      flex: 1;
      padding: 14px;
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-submit:hover {
      background: var(--navy-mid);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(26, 39, 68, 0.25);
    }

    .btn-submit:disabled {
      background: var(--muted);
      cursor: not-allowed;
      transform: none;
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ─── INBOX ─── */
    .inbox-header {
      background: linear-gradient(160deg, var(--navy) 0%, var(--navy-mid) 100%);
      padding: 32px 24px;
      color: var(--cream);
      margin-bottom: 32px;
    }

    .inbox-header h1 {
      font-family: 'Noto Serif KR', serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .inbox-container {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    .inbox-list {
      display: grid;
      gap: 16px;
    }

    .inbox-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(.34, 1.56, .64, 1);
    }

    .inbox-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold);
    }

    .inbox-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .inbox-card-from {
      font-family: 'Noto Serif KR', serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--navy);
    }

    .inbox-card-date {
      font-size: 12px;
      color: var(--muted);
    }

    .inbox-card-preview {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }

    .empty-state-emoji {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state-text {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* ─── LETTER VIEW ─── */
    .letter-view {
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
    }

    .letter-view-box {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      box-shadow: var(--shadow);
      animation: slideUp 0.4s ease;
    }

    .letter-view-header {
      font-family: 'Noto Serif KR', serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--cream-dark);
      text-align: right;
    }

    .letter-view-body {
      font-family: 'Noto Serif KR', serif;
      font-size: 14px;
      line-height: 1.9;
      color: var(--text);
      margin-bottom: 32px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .letter-view-footer {
      font-family: 'Noto Serif KR', serif;
      font-size: 14px;
      color: var(--navy);
      text-align: right;
      line-height: 1.8;
      border-top: 2px solid var(--cream-dark);
      padding-top: 16px;
    }

    .back-button {
      padding: 12px 24px;
      background: var(--cream-dark);
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 24px;
      transition: all 0.2s;
    }

    .back-button:hover {
      background: var(--cream-mid);
      transform: translateX(-2px);
    }

    /* ─── NAV ─── */
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--white);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 12px 0 24px 0;
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      text-align: center;
      cursor: pointer;
      padding: 12px;
      transition: all 0.2s;
      position: relative;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .nav-item.active {
      color: var(--navy);
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 3px;
      background: var(--gold);
      border-radius: 50%;
    }

    .nav-emoji {
      font-size: 20px;
      margin-bottom: 4px;
    }

    @media (max-width: 640px) {
      .home-cards {
        grid-template-columns: 1fr;
      }

      .letter-box,
      .modal-content {
        padding: 24px;
      }

      .home-hero {
        padding: 60px 20px 48px;
      }
    }
  </style>
</head>
<body>
  <!-- HOME -->
  <div id="home" class="page active">
    <div class="home-hero">
      <div class="home-inner">
        <div class="home-badge">너에게 온 편지</div>
        <h1 class="home-title">너온편</h1>
        <p class="home-sub">너의 고민을 편지에 담아 보내면<br>잠실고 선생님들의 진심 어린 조언과 위로의 편지가 도착할 거야~</p>
        <div class="home-cards">
          <div class="home-card" onclick="goToWriteLetter()">
            <span class="card-emoji">✍️</span>
            <div class="card-label">고민 나누기</div>
            <div class="card-title">편지 작성</div>
            <div class="card-desc">당신의 이야기를 선생님께 전해보세요</div>
          </div>
          <div class="home-card" onclick="goToInbox()">
            <span class="card-emoji">📬</span>
            <div class="card-label">응원받기</div>
            <div class="card-title">받은 편지</div>
            <div class="card-desc">선생님의 따뜻한 답장을 확인하세요</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- WRITE LETTER -->
  <div id="writeLetter" class="page">
    <div class="write-header">
      <h1>편지 작성</h1>
      <p>당신의 고민을 선생님께 전해보세요</p>
    </div>
    <div class="write-container">
      <div class="letter-box">
        <div class="preview-info" id="infoBox" style="display: none;">
          ✏️ 정보를 변경하려면 여기를 클릭하세요
        </div>
        
        <div id="infoDisplay" style="margin-bottom: 24px; padding: 16px; background: var(--cream-mid); border-radius: 10px; display: none;">
          <div style="font-size: 13px; color: var(--text); line-height: 1.8;">
            <div><strong>학년:</strong> <span id="displayGrade">-</span></div>
            <div><strong>닉네임:</strong> <span id="displayNickname">-</span></div>
            <div><strong>과목:</strong> <span id="displaySubject">-</span></div>
            <div><strong>키워드:</strong> <span id="displayKeyword">-</span></div>
          </div>
          <button class="btn btn-secondary" onclick="openInfoModal()" style="margin-top: 12px; width: 100%; padding: 10px;">정보 변경</button>
        </div>

        <div class="letter-header">선생님께</div>
        <textarea id="letterContent" class="letter-input" placeholder="당신의 고민을 여기에 써주세요..."></textarea>
        
        <div class="letter-footer">
          <span id="previewGrade">-</span><span id="previewNickname">-</span><span> 드림</span>
        </div>
      </div>

      <div class="submit-section">
        <button class="btn btn-secondary" onclick="goHome()" style="flex: 1; padding: 14px;">뒤로가기</button>
        <button class="btn-submit" id="submitBtn" style="flex: 1;" onclick="submitLetter()">편지 보내기 ✉️</button>
      </div>
    </div>
  </div>

  <!-- INBOX -->
  <div id="inbox" class="page">
    <div class="inbox-header">
      <h1>받은 편지</h1>
      <p>선생님들의 응원을 확인해보세요</p>
    </div>
    <div class="inbox-container">
      <div id="inboxList" class="inbox-list"></div>
    </div>
  </div>

  <!-- LETTER VIEW -->
  <div id="letterView" class="page">
    <div class="letter-view">
      <button class="back-button" onclick="goToInbox()">← 뒤로가기</button>
      <div class="letter-view-box">
        <div class="letter-view-header" id="viewFrom"></div>
        <div class="letter-view-body" id="viewBody"></div>
        <div class="letter-view-footer" id="viewFooter"></div>
      </div>
    </div>
  </div>

  <!-- INFO MODAL -->
  <div id="infoModal" class="modal">
    <div class="modal-content">
      <div class="modal-title">기본 정보 설정</div>
      
      <div class="form-group">
        <label>학년 선택</label>
        <select id="gradeSelect">
          <option value="">선택하세요</option>
          <option value="1학년">1학년</option>
          <option value="2학년">2학년</option>
          <option value="3학년">3학년</option>
        </select>
      </div>

      <div class="form-group">
        <label>닉네임</label>
        <input type="text" id="nicknameInput" placeholder="별명을 입력하세요">
      </div>

      <div class="form-group">
        <label>과목 선택</label>
        <select id="subjectSelect">
          <option value="">선택하세요</option>
          <option value="국어">국어</option>
          <option value="영어">영어</option>
          <option value="수학">수학</option>
          <option value="과학">과학</option>
          <option value="사회">사회</option>
        </select>
      </div>

      <div class="form-group">
        <label>고민 분류</label>
        <select id="keywordSelect">
          <option value="">선택하세요</option>
          <option value="학습법">학습법</option>
          <option value="성적">성적</option>
          <option value="선택과목">선택과목</option>
        </select>
      </div>

      <div class="modal-buttons">
        <button class="btn btn-secondary" onclick="closeInfoModal()">취소</button>
        <button class="btn btn-primary" onclick="saveInfo()">저장</button>
      </div>
    </div>
  </div>

  <!-- NAVIGATION -->
  <div class="nav">
    <div class="nav-item active" onclick="goHome()">
      <div class="nav-emoji">🏠</div>
      <div>홈</div>
    </div>
    <div class="nav-item" onclick="goToWriteLetter()">
      <div class="nav-emoji">✍️</div>
      <div>편지쓰기</div>
    </div>
    <div class="nav-item" onclick="goToInbox()">
      <div class="nav-emoji">📬</div>
      <div>받은편지</div>
    </div>
  </div>

  <script>
    // ─────────────────────────────────────
    // 🎨 프론트엔드: 화면 UI 관리 및 백엔드 통신
    // ─────────────────────────────────────

    // 백엔드 서버 주소 (이 주소로 데이터를 보냅니다)
    const API_URL = 'http://localhost:3000';

    // 사용자 정보 저장
    let userInfo = {
      grade: '',
      nickname: '',
      subject: '',
      keyword: ''
    };

    // 받은 편지 저장
    let letters = [];

    // ─── 페이지 네비게이션 ───
    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      updateNav(pageId);
      window.scrollTo(0, 0);
    }

    function updateNav(pageId) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      if (pageId === 'home') document.querySelectorAll('.nav-item')[0].classList.add('active');
      else if (pageId === 'writeLetter') document.querySelectorAll('.nav-item')[1].classList.add('active');
      else if (pageId === 'inbox') document.querySelectorAll('.nav-item')[2].classList.add('active');
    }

    function goHome() { showPage('home'); }
    
    function goToWriteLetter() { 
      if (userInfo.grade && userInfo.nickname && userInfo.subject && userInfo.keyword) {
        showPage('writeLetter');
        document.getElementById('infoBox').style.display = 'block';
        document.getElementById('infoDisplay').style.display = 'block';
      } else {
        openInfoModal();
      }
    }
    
    function goToInbox() { 
      showPage('inbox');
      loadLetters();
    }

    // ─── 정보 모달 ───
    function openInfoModal() {
      document.getElementById('infoModal').classList.add('active');
      document.getElementById('gradeSelect').value = userInfo.grade;
      document.getElementById('nicknameInput').value = userInfo.nickname;
      document.getElementById('subjectSelect').value = userInfo.subject;
      document.getElementById('keywordSelect').value = userInfo.keyword;
    }

    function closeInfoModal() {
      document.getElementById('infoModal').classList.remove('active');
    }

    function saveInfo() {
      userInfo.grade = document.getElementById('gradeSelect').value;
      userInfo.nickname = document.getElementById('nicknameInput').value;
      userInfo.subject = document.getElementById('subjectSelect').value;
      userInfo.keyword = document.getElementById('keywordSelect').value;

      if (!userInfo.grade || !userInfo.nickname || !userInfo.subject || !userInfo.keyword) {
        alert('모든 정보를 입력해주세요.');
        return;
      }

      updateInfoDisplay();
      closeInfoModal();
      showPage('writeLetter');
      document.getElementById('infoBox').style.display = 'block';
      document.getElementById('infoDisplay').style.display = 'block';
    }

    function updateInfoDisplay() {
      document.getElementById('displayGrade').textContent = userInfo.grade;
      document.getElementById('displayNickname').textContent = userInfo.nickname;
      document.getElementById('displaySubject').textContent = userInfo.subject;
      document.getElementById('displayKeyword').textContent = userInfo.keyword;
      document.getElementById('previewGrade').textContent = userInfo.grade;
      document.getElementById('previewNickname').textContent = userInfo.nickname;
    }

    // ─── 편지 제출 (백엔드로 데이터 전송) ───
    async function submitLetter() {
      if (!userInfo.grade || !userInfo.nickname || !userInfo.subject || !userInfo.keyword) {
        alert('기본 정보를 먼저 설정해주세요.');
        openInfoModal();
        return;
      }

      const content = document.getElementById('letterContent').value.trim();
      if (!content) {
        alert('편지 내용을 입력해주세요.');
        return;
      }

      // 버튼 비활성화 (중복 제출 방지)
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading-spinner"></span> 선생님이 답장 중...';

      try {
        // ✨ 백엔드로 데이터 전송
        const response = await fetch(`${API_URL}/api/reply`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            studentGrade: userInfo.grade,
            studentNickname: userInfo.nickname,
            studentSubject: userInfo.subject,
            studentKeyword: userInfo.keyword,
            studentLetter: content
          })
        });

        if (!response.ok) {
          throw new Error('서버 오류: ' + response.status);
        }

        const data = await response.json();

        // 편지 저장
        const letter = {
          id: Date.now(),
          studentGrade: userInfo.grade,
          studentNickname: userInfo.nickname,
          studentSubject: userInfo.subject,
          studentKeyword: userInfo.keyword,
          studentLetter: content,
          teacherReply: data.reply, // ← 백엔드에서 받은 AI 답변
          date: new Date().toLocaleDateString('ko-KR')
        };

        letters.push(letter);
        localStorage.setItem('neoenpyeon_letters', JSON.stringify(letters));

        alert('✅ 편지가 보내졌습니다!\n\n선생님의 답장을 "받은 편지함"에서 확인할 수 있습니다 📬');
        document.getElementById('letterContent').value = '';
        
        setTimeout(() => {
          goToInbox();
        }, 1000);

      } catch (error) {
        console.error('오류:', error);
        alert('❌ 오류 발생: ' + error.message + '\n\n백엔드 서버가 실행 중인지 확인해주세요.\n터미널에서 "node backend/app.js" 실행');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '편지 보내기 ✉️';
      }
    }

    // ─── 받은 편지함 ───
    async function loadLetters() {
      const listEl = document.getElementById('inboxList');
      
      try {
        // 백엔드에서 모든 편지 로드 (나중에 추가 가능)
        letters = JSON.parse(localStorage.getItem('neoenpyeon_letters')) || [];
      } catch (e) {
        letters = [];
      }

      if (letters.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-emoji">📭</div>
            <div class="empty-state-text">아직 받은 편지가 없어요<br>첫 번째 고민을 선생님께 전해보세요</div>
            <button class="btn btn-primary" onclick="goToWriteLetter()" style="width: 100%;">편지 작성하기</button>
          </div>
        `;
        return;
      }

      listEl.innerHTML = letters.map(letter => `
        <div class="inbox-card" onclick="viewLetter(${letter.id})">
          <div class="inbox-card-header">
            <div class="inbox-card-from">
              <strong>${letter.studentNickname}</strong>에게 (${letter.studentSubject})
            </div>
            <div class="inbox-card-date">${letter.date}</div>
          </div>
          <div class="inbox-card-preview">${letter.teacherReply.substring(0, 80)}...</div>
        </div>
      `).join('');
    }

    function viewLetter(id) {
      const letter = letters.find(l => l.id === id);
      if (!letter) return;

      document.getElementById('viewFrom').textContent = letter.studentNickname + '에게';
      document.getElementById('viewBody').textContent = letter.teacherReply;
      document.getElementById('viewFooter').textContent = '항상 응원하고 있는\n선생님이';

      showPage('letterView');
    }

    // 초기화
    window.addEventListener('load', () => {
      loadLetters();
    });
  </script>
</body>
</html>
