<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>선택과목 상담</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="page-header">
    <div class="ph-inner">
      <div>
        <div class="ph-title">💬 선택과목 상담</div>
        <div class="ph-desc">잠시리가 맞춤 과목 추천을 도와드릴게요</div>
      </div>
      <a href="../../index.html" target="_parent" class="home-link">🏠 홈으로</a>
    </div>
  </div>

  <div class="consult-shell">
    <!-- STEP 1: 설정 화면 -->
    <div id="consultSetup" style="flex:1;overflow-y:auto;padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cream);">
      <div style="max-width:560px;width:100%;">
        <!-- 학년 선택 -->
        <div class="setup-section">
          <div class="setup-label">① 현재 학년을 선택해주세요</div>
          <div style="display:flex;gap:10px;margin-bottom:8px;">
            <button class="setup-btn" id="grade-1" onclick="selectGrade(1)">1학년</button>
            <button class="setup-btn" id="grade-2" onclick="selectGrade(2)">2학년</button>
          </div>
          <div style="font-size:12px;color:var(--gold);background:rgba(184,151,58,.1);padding:8px 14px;border-radius:8px;border:1px solid rgba(184,151,58,.2);">
            💡 1학년은 2학년 선택과목을, 2학년은 3학년 선택과목을 추천해드립니다.
          </div>
        </div>

        <!-- 계열 선택 -->
        <div class="setup-section" id="trackSection" style="display:none;">
          <div class="setup-label">② 계열을 선택해주세요</div>
          <div style="display:flex;gap:10px;">
            <button class="setup-btn" id="track-stem" onclick="selectTrack('stem')">이과</button>
            <button class="setup-btn" id="track-hum" onclick="selectTrack('hum')">문과</button>
            <button class="setup-btn" id="track-art" onclick="selectTrack('art')">예체능</button>
          </div>
        </div>

        <!-- 세부 계열 선택 -->
        <div class="setup-section" id="majorSection" style="display:none;">
          <div class="setup-label" id="majorLabel">③ 세부 계열을 선택해주세요</div>
          <div id="majorBtns" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
          <div id="majorDetail" style="margin-top:10px;font-size:12px;color:var(--muted);background:var(--cream-mid);padding:10px 14px;border-radius:8px;display:none;line-height:1.7;"></div>
        </div>

        <!-- 시작 버튼 -->
        <div id="startBtnWrap" style="display:none;margin-top:8px;">
          <button onclick="startConsult()" style="width:100%;padding:14px;background:var(--navy);color:var(--cream);border:none;border-radius:12px;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;">
            상담 시작하기 →
          </button>
        </div>
      </div>
    </div>

    <!-- STEP 2: 채팅 화면 -->
    <div id="consultChat" class="consult-wrap" style="display:none;">
      <!-- 사이드바: 설정 요약 + 변경 -->
      <div class="c-sidebar" style="overflow-y:auto;">
        <div class="c-sidebar-title">상담 정보</div>
        <div id="setupSummary" style="background:var(--cream-mid);border-radius:10px;padding:12px;font-size:12px;color:var(--text);line-height:1.8;margin-bottom:14px;"></div>
        <button onclick="resetConsult()" style="width:100%;padding:8px;background:transparent;border:1px solid var(--border);border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--muted);cursor:pointer;transition:all .2s;">
          ← 처음으로 돌아가기
        </button>
        <hr style="border:none;border-top:1px solid var(--border);margin:16px 0;"/>
        <div class="c-sidebar-title">2학년 선행과목 체크</div>
        <div id="prereqCheck" style="font-size:11px;color:var(--muted);">2학년 이용자만 해당됩니다.</div>
      </div>

      <!-- 채팅 메인 -->
      <div class="c-main">
        <div class="c-header">
          <div class="c-header-title">💬 잠시리 선택과목 상담</div>
          <div class="c-header-sub" id="track-disp">정보 로딩 중...</div>
        </div>
        <div class="chat-area" id="chatArea"></div>
        <div class="quick-row" id="quickRow">
          <button class="q-btn" onclick="showSubjectList()">📋 과목 목록</button>
          <button class="q-btn" onclick="showSubjectRules()">📜 과목 선택 규칙</button>
          <button class="q-btn" onclick="showMustSubjects()">⭐ 필수 과목 추천</button>
          <button class="q-btn" onclick="showScheduleBuilder()">🗓 과목 선택표 짜기</button>
          <button class="q-btn" onclick="copyChat()">📋 복사</button>
          <button class="q-btn" onclick="saveChat()">💾 저장</button>
          <button class="q-btn" onclick="clearChat()">🔄 대화 초기화</button>
        </div>
        <div class="chat-input-row">
          <textarea class="chat-inp" id="chatInput" placeholder="선택과목에 관해 궁금한 것을 물어보세요..." rows="1"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
            oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMsg()">↑</button>
        </div>
      </div>
    </div>

    <!-- 2학년 선행과목 체크 모달 -->
    <div class="modal-overlay" id="prereqModal" onclick="if(event.target===this)closePrereq()">
      <div class="modal-box" style="max-width:480px;">
        <div class="modal-top">
          <div class="modal-title">📚 선행과목 확인</div>
          <button class="modal-close" onclick="closePrereq()">×</button>
        </div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">2학년 때 수강한 과목을 체크해주세요. 위계 과목 추천에 반영됩니다.</p>
        <div id="prereqList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;"></div>
        <button onclick="confirmPrereq()" style="width:100%;padding:11px;background:var(--navy);color:var(--cream);border:none;border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer;">확인</button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
