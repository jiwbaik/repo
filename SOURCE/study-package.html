<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyPack — 학습 캘린더</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // 1. 블록 데이터 정의 (보내주신 고유 컬러 및 다크 모드 색상 반영)
        const BLOCK_TYPES = [
            { id: "preview", label: "예습", emoji: "📖", color: "#6ee7b7", dark: "#059669" },
            { id: "review", label: "복습(평소)", emoji: "📝", color: "#93c5fd", dark: "#2563eb" },
            { id: "week3", label: "시험 3주전", emoji: "🗓️", color: "#fde68a", dark: "#d97706" },
            { id: "week2", label: "시험 2주전", emoji: "⚡", color: "#fca5a5", dark: "#dc2626" },
            { id: "week1", label: "시험 1주전", emoji: "🔥", color: "#f9a8d4", dark: "#db2777" }
        ];

        const SUBJECTS_DEFAULT = ["수학", "영어", "국어", "과학", "사회", "역사", "물리", "화학", "생물", "지구과학"];
        const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

        // 2. 클로드 라이브러리에 내장되어 있던 6종 패키지 팩 완벽 이식
        const PACKS = [
            {
                id: "starter", name: "스타터팩", emoji: "🌱", desc: "처음 계획을 세우는 학생을 위한 기본 루틴", tag: "입문 추천", tagColor: "#059669", cover: "#f0fdf4",
                blocks: {
                    preview: ["교과서 목차 훑어보기", "핵심 용어 3개 찾기", "학습 목표 적기"],
                    review: ["오늘 배운 내용 노트 정리", "교과서 핵심 문장 밑줄", "오답 노트 작성"],
                    week3: ["단원별 개념 정리 시작", "기출 유형 파악", "약점 단원 체크"],
                    week2: ["취약 단원 집중 복습", "기출 1회분 풀기", "오답 원인 분석"],
                    week1: ["기출 2회분 풀기", "오답 반복 학습", "마무리 개념 점검"]
                }
            },
            {
                id: "veteran", name: "마스터팩", emoji: "🏆", desc: "효율적 학습 전략이 필요한 고급 학습자를 위한 루틴", tag: "고급 전략", tagColor: "#db2777", cover: "#fffff2",
                blocks: {
                    preview: ["선행 개념 지도 그리기", "예상 출제 포인트 예측", "관련 개념 연결망 작성"],
                    review: ["코넬 노트 기법으로 정리", "5분 자기 설명 (Feynman)", "고난도 문제 1~2개 도전"],
                    week3: ["출제 경향 분석", "핵심 공식 압축 카드 제작", "모의 문제 출제 연습"],
                    week2: ["실전 모의고사 시간 측정", "취약 유형 집중 드릴", "메타인지 점검"],
                    week1: ["암기 사항 최종 점검", "자주 틀리는 포인트 리스트", "멘탈 & 컨디션 정리"]
                }
            },
            {
                id: "cram", name: "벼락치기팩", emoji: "⚡", desc: "시험 3일 전! 핵심만 빠르게 쓸어담는 단기 집중 전략", tag: "긴급 대응", tagColor: "#dc2626", cover: "#fef2f2",
                blocks: {
                    preview: ["출제범위 목차 30초 스캔", "작년 기출 유형 파악 (10분)", "선생님 강조 포인트 체크"],
                    review: ["수업 필기 핵심만 압축 정리", "주요 공식 A4 1장으로", "친구한테 설명해보기"],
                    week3: ["단원별 핵심 개념 마인드맵", "교과서 굵은 글씨 전부 암기", "예상 문제 10개 직접 만들기"],
                    week2: ["오답률 높은 문제만 집중", "시험 범위 개념 총복습", "취약 파트 문제집 1단원"],
                    week1: ["모의 시험지 2회 실전 풀이", "오답 원인 1줄씩 정리", "전날 밤 암기 파이널 체크"]
                }
            },
            {
                id: "vacation", name: "방학팩", emoji: "🌴", desc: "방학을 알차게! 선행과 복습을 균형 있게 잡는 루틴", tag: "방학용", tagColor: "#d97706", cover: "#fefce8",
                blocks: {
                    preview: ["다음 학기 교과서 목차 파악", "선행 강의 1강 시청", "모르는 개념 리스트업"],
                    review: ["지난 학기 오답노트 복습", "핵심 공식 플래시카드 제작", "취약 단원 문제집 1회독"],
                    week3: ["선행 3단원 개념 완성 목표", "매일 30분 독서 병행", "영단어 30개 암기"],
                    week2: ["선행 범위 모의 문제 풀이", "방학 과제 절반 완성 체크", "다음 학기 예상 범위 파악"],
                    week1: ["방학 학습 총정리 노트", "새학기 준비물 & 계획 세우기", "컨디션 & 수면 패턴 정상화"]
                }
            }
        ];

        // 3. 날짜 포맷 헬퍼 함수들
        const getDays = (y, m) => new Date(y, m + 1, 0).getDate();
        const getFirstDay = (y, m) => new Date(y, m, 1).getDay();
        const toStr = (y, m, d) => `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

        function App() {
            const [currentYear, setCurrentYear] = useState(2026);
            const [currentMonth, setCurrentMonth] = useState(4); // 5월 (0부터 시작하므로 4)
            const [selectedPackage, setSelectedPackage] = useState(PACKS[0].id);
            const [selectedBlock, setSelectedBlock] = useState("preview");
            const [selectedDate, setSelectedDate] = useState("2026-05-15");
            const [assignedPlans, setAssignedPlans] = useState({}); // 날짜별 매핑 저장소
            const [completedTasks, setCompletedTasks] = useState({}); // 완료 체크용

            // 달력에 들어갈 일자 배열 자동 생성 계산기
            const calendarDays = useMemo(() => {
                const totalDays = getDays(currentYear, currentMonth);
                const firstDayIdx = getFirstDay(currentYear, currentMonth);
                const daysArr = [];
                for (let i = 0; i < firstDayIdx; i++) daysArr.push(null);
                for (let d = 1; d <= totalDays; d++) daysArr.push(d);
                return daysArr;
            }, [currentYear, currentMonth]);

            // 날짜 클릭 시 해당 날짜에 선택한 패키지와 블록을 주입하는 액션 함수
            const handleDayClick = (day) => {
                if (!day) return;
                const dateKey = toStr(currentYear, currentMonth, day);
                setSelectedDate(dateKey);

                const currentPackObj = PACKS.find(p => p.id === selectedPackage);
                const currentBlockObj = BLOCK_TYPES.find(b => b.id === selectedBlock);

                if (currentPackObj && currentBlockObj) {
                    const newPlan = {
                        packageName: currentPackObj.name,
                        blockLabel: currentBlockObj.label,
                        blockColor: currentBlockObj.color,
                        blockId: currentBlockObj.id,
                        tasks: currentPackObj.blocks[selectedBlock] || ["등록된 학습 미션이 없습니다."]
                    };
                    setAssignedPlans({ ...assignedPlans, [dateKey]: newPlan });
                }
            };

            const handlePrevMonth = () => {
                if (currentMonth === 0) { setCurrentMonth(11); setCurrentYear(currentYear - 1); }
                else { setCurrentMonth(currentMonth - 1); }
            };

            const handleNextMonth = () => {
                if (currentMonth === 11) { setCurrentMonth(0); setCurrentYear(currentYear + 1); }
                else { setCurrentMonth(currentMonth + 1); }
            };

            const toggleTask = (dateKey, index) => {
                const taskKey = `${dateKey}-${index}`;
                setCompletedTasks({ ...completedTasks, [taskKey]: !completedTasks[taskKey] });
            };

            const clearDayPlan = (dateKey) => {
                const updated = { ...assignedPlans };
                delete updated[dateKey];
                setAssignedPlans(updated);
            };

            const activePlan = assignedPlans[selectedDate];

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col">
                    {/* 최상단 네비게이션 헤더 바 */}
                    <header className="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center shadow-xs">
                        <div className="flex items-center space-x-2">
                            <span className="text-2xl font-bold text-indigo-600">📚 StudyPack</span>
                            <span className="text-xs bg-slate-100 text-slate-500 font-medium px-2 py-0.5 rounded-sm">고등 러닝 솔루션</span>
                        </div>
                        <div className="flex space-x-6 text-sm font-semibold text-slate-600">
                            <span className="text-indigo-600 border-b-2 border-indigo-600 pb-1 cursor-pointer">📆 캘린더 엔진 플래너</span>
                        </div>
                    </header>

                    {/* 핵심 콘텐츠 레이아웃 파트 */}
                    <main className="max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
                        
                        {/* 1. 왼쪽 영역: STEP 선택 컨트롤 보드 (4컬럼 수용) */}
                        <section className="lg:col-span-3 space-y-6 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs h-fit">
                            <div>
                                <h3 className="text-xs font-bold text-slate-400 tracking-wider uppercase mb-3">STEP 1 · 패키지 전략 선택</h3>
                                <div className="space-y-2">
                                    {PACKS.map(pack => (
                                        <button
                                            key={pack.id}
                                            onClick={() => setSelectedPackage(pack.id)}
                                            className={`w-full text-left p-3 rounded-xl border transition-all ${selectedPackage === pack.id ? 'border-indigo-600 bg-indigo-50/50 shadow-2xs' : 'border-slate-200 hover:bg-slate-50'}`}
                                        >
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-sm text-slate-900">{pack.emoji} {pack.name}</span>
                                                <span className="text-[10px] px-2 py-0.5 rounded-full font-medium" style={{ backgroundColor: pack.cover, color: pack.tagColor }}>{pack.tag}</span>
                                            </div>
                                            <p className="text-[11px] text-slate-500 mt-1 line-clamp-1">{pack.desc}</p>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <hr className="border-slate-100" />

                            <div>
                                <h3 className="text-xs font-bold text-slate-400 tracking-wider uppercase mb-3">STEP 2 · 매핑 타겟 블록 선택</h3>
                                <div className="space-y-2">
                                    {BLOCK_TYPES.map(block => (
                                        <button
                                            key={block.id}
                                            onClick={() => setSelectedBlock(block.id)}
                                            className={`w-full text-left p-2.5 rounded-xl border text-xs font-semibold flex items-center justify-between transition-all ${selectedBlock === block.id ? 'ring-2 ring-indigo-600 border-transparent shadow-xs' : 'border-slate-200 hover:bg-slate-50'}`}
                                            style={{ backgroundColor: selectedBlock === block.id ? block.color : '#ffffff' }}
                                        >
                                            <div className="flex items-center space-x-2">
                                                <span>{block.emoji}</span>
                                                <span className="text-slate-900">{block.label} 루틴</span>
                                            </div>
                                            <span className="text-[10px] text-slate-500 opacity-80">선택</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* 2. 중앙 영역: 메인 학습 캘린더 그리드 보드 (5컬럼 수용) */}
                        <section className="lg:col-span-5 bg-white p-6 rounded-2xl border border-slate-200 shadow-xs flex flex-col">
                            <div className="flex justify-between items-center mb-6">
                                <button onClick={handlePrevMonth} className="p-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-sm font-bold">◀</button>
                                <h2 className="text-lg font-bold text-slate-900">{currentYear}년 {currentMonth + 1}월</h2>
                                <button onClick={handleNextMonth} className="p-1.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-sm font-bold">▶</button>
                            </div>

                            {/* 요일 헤더행 */}
                            <div className="grid grid-cols-7 gap-1 text-center mb-2">
                                {WEEKDAYS.map((w, idx) => (
                                    <span key={w} className={`text-xs font-bold py-1 ${idx === 0 ? 'text-red-500' : idx === 6 ? 'text-blue-500' : 'text-slate-400'}`}>{w}</span>
                                ))}
                            </div>

                            {/* 캘린더 핵심 그리드 셀 바디 */}
                            <div className="grid grid-cols-7 gap-1.5 grid-rows-5 flex-1">
                                {calendarDays.map((day, idx) => {
                                    const dateKey = day ? toStr(currentYear, currentMonth, day) : null;
                                    const hasPlan = dateKey && assignedPlans[dateKey];
                                    const isSelected = dateKey === selectedDate;

                                    return (
                                        <div
                                            key={idx}
                                            onClick={() => day && handleDayClick(day)}
                                            className={`min-h-[70px] p-1.5 border rounded-xl flex flex-col justify-between cursor-pointer transition-all ${day ? 'bg-white' : 'bg-slate-50/50 border-transparent cursor-default'} ${isSelected ? 'ring-2 ring-indigo-600 border-transparent z-10' : 'border-slate-100 hover:border-slate-300'}`}
                                        >
                                            {day ? (
                                                <>
                                                    <span className={`text-xs font-bold ${idx % 7 === 0 ? 'text-red-500' : idx % 7 === 6 ? 'text-blue-500' : 'text-slate-700'}`}>{day}</span>
                                                    {hasPlan && (
                                                        <div 
                                                            className="text-[9px] px-1 py-0.5 rounded-sm font-bold text-center truncate text-slate-900 shadow-2xs" 
                                                            style={{ backgroundColor: assignedPlans[dateKey].blockColor }}
                                                        >
                                                            {assignedPlans[dateKey].packageName.substring(0,3)}·{assignedPlans[dateKey].blockLabel}
                                                        </div>
                                                    )}
                                                </>
                                            ) : null}
                                        </div>
                                    );
                                })}
                            </div>
                        </section>

                        {/* 3. 오른쪽 영역: 실시간 투두 패널 가이드 서랍 (3컬럼 수용) */}
                        <section className="lg:col-span-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-xs h-fit">
                            <div className="border-b border-slate-100 pb-4 mb-4 flex justify-between items-center">
                                <div>
                                    <h2 className="text-base font-bold text-slate-900">📅 {selectedDate} 미션 피드</h2>
                                    <p className="text-[11px] text-slate-400 mt-0.5">날짜를 선택하면 맞춤 행동 플랜이 자동 동기화됩니다.</p>
                                </div>
                                {activePlan && (
                                    <button onClick={() => clearDayPlan(selectedDate)} className="text-xs text-red-500 hover:font-bold transition">초기화</button>
                                )}
                            </div>

                            {activePlan ? (
                                <div className="space-y-4">
                                    <div className="p-3 rounded-xl border flex items-center space-x-2 shadow-3xs" style={{ backgroundColor: activePlan.blockColor + '30', borderColor: activePlan.blockColor }}>
                                        <span className="text-sm">📌</span>
                                        <span className="text-xs font-bold text-slate-900">{activePlan.packageName} · {activePlan.blockLabel} 과정</span>
                                    </div>

                                    <div className="space-y-2.5">
                                        {activePlan.tasks.map((task, index) => {
                                            const taskKey = `${selectedDate}-${index}`;
                                            const isDone = !!completedTasks[taskKey];

                                            return (
                                                <label 
                                                    key={index} 
                                                    className={`flex items-start space-x-3 p-3 rounded-xl border cursor-pointer transition-all ${isDone ? 'bg-slate-50/80 border-slate-200 opacity-60' : 'bg-white border-slate-200 hover:border-slate-300'}`}
                                                >
                                                    <input
                                                        type="checkbox"
                                                        checked={isDone}
                                                        onChange={() => toggleTask(selectedDate, index)}
                                                        className="mt-0.5 h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-0"
                                                    />
                                                    <span className={`text-xs leading-relaxed ${isDone ? 'line-through text-slate-400 font-normal' : 'text-slate-800 font-semibold'}`}>
                                                        {task}
                                                    </span>
                                                </label>
                                            );
                                        })}
                                    </div>
                                </div>
                            ) : (
                                <div className="text-center py-20 border border-dashed border-slate-200 rounded-2xl bg-slate-50/50">
                                    <span className="text-3xl block">💡</span>
                                    <p className="text-slate-400 mt-2 text-xs font-semibold">설정된 공부 블록이 없는 날입니다.</p>
                                    <p className="text-[11px] text-slate-400 mt-1">왼쪽에서 팩과 블록을 고른 후<br />달력 날짜를 클릭해 보세요!</p>
                                </div>
                            )}
                        </section>
                    </main>
                </div>
            );
        }

        // 렌더링 파이프라인 최종 바인딩
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
