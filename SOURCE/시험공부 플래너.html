<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 시험공부 플래너</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: '맑은 고딕', 'Malgun Gothic', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-[#eef2ff] text-slate-800 antialiased min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // 파이썬 코드의 상수값 정의
        const BASE_SCORE = 10;
        const WEAK_WEIGHT = 3;
        const FOCUS_WEIGHT = 5;
        const MATH_BONUS = 3;

        const COLORS = [
            "#3b82f6", "#ef4444", "#10b981", "#f59e0b", "#8b5cf6",
            "#ec4899", "#06b6d4", "#84cc16", "#f97316", "#6366f1",
        ];

        const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

        function App() {
            // 데이터 저장소 상태 관리
            const [subjects, setSubjects] = useState([]);
            const [scores, setScores] = useState([]);
            const [studySessions, setStudySessions] = useState([]);

            // 입력 및UI 바인딩 상태 관리
            const [inputSubject, setInputSubject] = useState("");
            const [currentYear, setCurrentYear] = useState(2026);
            const [currentMonth, setCurrentMonth] = useState(4); // 5월 (0부터 시작하므로 4)
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            
            // 모달/계획추가 폼 관리
            const [showAddForm, setShowAddForm] = useState(false);
            const [formSubject, setFormSubject] = useState("");
            const [formDuration, setFormDuration] = useState("60");

            // 1. 과목 추가 기능
            const addSubject = () => {
                const name = inputSubject.strip ? inputSubject.strip() : inputSubject.trim();
                if (!name) return;
                
                const newSubject = {
                    id: String(Date.now()),
                    name: name,
                    isWeak: false,
                    isFocus: false,
                    customWeight: 0
                };
                setSubjects([...subjects, newSubject]);
                setInputSubject("");
            };

            // 2. 과목 삭제 기능
            const removeSubject = (id) => {
                setSubjects(subjects.filter(s => s.id !== id));
            };

            // 3. 체크박스 및 가중치 입력 핸들러
            const toggleSubjectProp = (id, prop) => {
                setSubjects(subjects.map(s => s.id === id ? { ...s, [prop]: !s[prop] } : s));
            };

            const handleWeightChange = (id, value) => {
                let weight = parseInt(value) || 0;
                if (weight < 0) weight = 0;
                if (weight > 20) weight = 20;
                setSubjects(subjects.map(s => s.id === id ? { ...s, customWeight: weight } : s));
            };

            // 4. 우선순위 계산 기능 (Tkinter의 calculate_priorities 완벽 복제)
            const calculatePriorities = () => {
                if (subjects.length === 0) {
                    alert("과목을 먼저 추가해주세요!");
                    return;
                }

                const calculated = subjects.map((s, i) => {
                    let score = BASE_SCORE;
                    if (s.name.includes("수학")) {
                        score += MATH_BONUS;
                    }
                    if (s.isWeak) {
                        score += WEAK_WEIGHT;
                    }
                    if (s.isFocus) {
                        score += FOCUS_WEIGHT;
                    }
                    score += s.customWeight;

                    return {
                        name: s.name,
                        score: score,
                        percentage: 0,
                        color: COLORS[i % COLORS.length]
                    };
                });

                const total = calculated.reduce((acc, curr) => acc + curr.score, 0);
                
                const finalScores = calculated.map(c => ({
                    ...c,
                    percentage: (c.score / total) * 100
                }));

                setScores(finalScores);
                if(finalScores.length > 0 && !formSubject) {
                    setFormSubject(finalScores[0].name);
                }
                alert("우선순위 계산이 완료되었습니다! ✅");
            };

            // 5. 달력 헬퍼 연산 파트
            const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
            const firstWeekday = (y, m) => new Date(y, m, 1).getDay();

            const calendarCells = useMemo(() => {
                const totalDays = daysInMonth(currentYear, currentMonth);
                const startIdx = firstWeekday(currentYear, currentMonth);
                const cells = [];
                for (let i = 0; i < startIdx; i++) cells.push(null);
                for (let d = 1; d <= totalDays; d++) cells.push(d);
                return cells;
            }, [currentYear, currentMonth]);

            const changeMonth = (direction) => {
                if (direction === "prev") {
                    if (currentMonth === 0) { setCurrentMonth(11); setCurrentYear(currentYear - 1); }
                    else { setCurrentMonth(currentMonth - 1); }
                } else {
                    if (currentMonth === 11) { setCurrentMonth(0); setCurrentYear(currentYear + 1); }
                    else { setCurrentMonth(currentMonth + 1); }
                }
            };

            // 6. 학습 계획 추가 기능
            const handleAddSession = () => {
                if (!formSubject || !formDuration) return;
                
                const targetScore = scores.find(s => s.name === formSubject);
                const newSession = {
                    id: String(Date.now()),
                    subjectName: formSubject,
                    duration: parseInt(formDuration) || 0,
                    date: selectedDate,
                    color: targetScore ? targetScore.color : "#3b82f6"
                };

                setStudySessions([...studySessions, newSession]);
                setShowAddForm(false);
            };

            // 7. 추천값 적용 엔진 알고리즘
            const applyRecommended = () => {
                const sc = scores.find(s => s.name === formSubject);
                if (sc) {
                    const weekly_h = 20;
                    const rec_min = Math.round((sc.percentage / 100) * weekly_h * 60);
                    setFormDuration(String(rec_min));
                }
            };

            const removeSession = (id) => {
                setStudySessions(studySessions.filter(s => s.id !== id));
            };

            // 특정 날짜의 세션 데이터 필터링
            const sessionsToday = useMemo(() => {
                return studySessions.filter(s => s.date === selectedDate);
            }, [studySessions, selectedDate]);

            return (
                <div className="max-w-6xl mx-auto px-4 py-8">
                    {/* 상단 헤더 프레임 */}
                    <header className="text-center mb-8">
                        <h1 className="text-3xl font-bold text-[#1e1b4b] mb-2">📚 시험공부 플래너</h1>
                        <p className="text-sm text-slate-500">과목별 우선순위를 설정하고 효율적인 학습 계획을 세워보세요</p>
                    </header>

                    {/* 메인 2열 레이아웃 대시보드 */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        
                        {/* ── 과목 관리 컴포넌트 (좌) ── */}
                        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 flex flex-col h-[520px]">
                            <h2 className="text-lg font-bold text-slate-800 mb-4">과목 관리</h2>
                            
                            {/* 과목 등록 폼 서랍 */}
                            <div className="flex gap-2 mb-4">
                                <input 
                                    type="text" 
                                    placeholder="과목명 입력 (예: 수학, 영어)"
                                    value={inputSubject}
                                    onChange={(e) => setInputSubject(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && addSubject()}
                                    className="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
                                />
                                <button onClick={addSubject} className="bg-[#2563eb] text-white text-sm font-bold px-4 py-2 rounded-lg hover:bg-[#1d4ed8] transition shrink-0">
                                    + 추가
                                </button>
                            </div>

                            {/* 과목 리스트 내부 스크롤 뷰 스페이스 */}
                            <div className="flex-1 overflow-y-auto space-y-3 pr-1 mb-4">
                                {subjects.length === 0 ? (
                                    <div className="text-center text-slate-400 text-sm py-20">📖 과목을 추가해주세요</div>
                                ) : (
                                    subjects.map(s => (
                                        <div key={s.id} className="p-4 border border-slate-200 rounded-lg bg-white space-y-3 shadow-2xs">
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-slate-800 text-sm">{s.name}</span>
                                                <button onClick={() => removeSubject(s.id)} className="text-red-500 hover:text-red-700 text-sm">🗑</button>
                                            </div>
                                            <div className="flex flex-wrap gap-4 text-xs">
                                                <label className="flex items-center space-x-1.5 cursor-pointer text-red-500 font-medium">
                                                    <input type="checkbox" checked={s.isWeak} onChange={() => toggleSubjectProp(s.id, 'isWeak')} className="rounded border-slate-300 text-red-500 focus:ring-0" />
                                                    <span>⚠ 취약 과목 (+{WEEK_WEIGHT}점)</span>
                                                </label>
                                                <label className="flex items-center space-x-1.5 cursor-pointer text-emerald-600 font-medium">
                                                    <input type="checkbox" checked={s.isFocus} onChange={() => toggleSubjectProp(s.id, 'isFocus')} className="rounded border-slate-300 text-emerald-500 focus:ring-0" />
                                                    <span>🎯 집중 관리 (+{FOCUS_WEIGHT}점)</span>
                                                </label>
                                            </div>
                                            <div className="flex items-center space-x-2 text-xs text-slate-500">
                                                <span>사용자 가중치:</span>
                                                <input 
                                                    type="number" 
                                                    value={s.customWeight} 
                                                    onChange={(e) => handleWeightChange(s.id, e.target.value)}
                                                    className="w-14 border border-slate-300 rounded px-1.5 py-0.5 text-center text-slate-800"
                                                />
                                                <span>점 (0-20)</span>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>

                            <button onClick={calculatePriorities} className="w-full bg-[#4f46e5] text-white font-bold py-3 rounded-lg hover:bg-[#4338ca] transition shadow-xs">
                                우선순위 계산하기
                            </button>
                        </div>

                        {/* ── 추천 비율 보드 컴포넌트 (우) ── */}
                        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 flex flex-col h-[520px]">
                            <h2 className="text-lg font-bold text-slate-800 mb-4">학습 추천 비율</h2>
                            
                            <div className="flex-1 flex flex-col justify-center overflow-y-auto mb-4">
                                {scores.length === 0 ? (
                                    <div className="text-center text-slate-400 text-sm py-20">🎯 우선순위를 계산해주세요</div>
                                ) : (
                                    <div className="space-y-4 w-full px-1">
                                        {scores.map((sc, idx) => (
                                            <div key={idx} className="space-y-1">
                                                <div className="flex justify-between items-center text-xs font-semibold">
                                                    <div className="flex items-center space-x-1">
                                                        <span style={{ color: sc.color }}>■</span>
                                                        <span className="text-slate-800">{sc.name}</span>
                                                    </div>
                                                    <span className="text-slate-500">{sc.percentage.toFixed(1)}% (점수: {sc.score}점)</span>
                                                </div>
                                                <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                                                    <div style={{ width: `${sc.percentage}%`, backgroundColor: sc.color }} className="h-full rounded-full transition-all duration-300"></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* 점수 가이드 안내 인포 박스 */}
                            <div className="bg-[#eff6ff] rounded-xl p-4 text-xs text-slate-700 leading-relaxed border border-blue-100">
                                <h3 className="font-bold mb-1.5 text-blue-900 flex items-center">📊 점수 계산 방식</h3>
                                <ul className="space-y-0.5 list-disc pl-4">
                                    <li>기본 점수: {BASE_SCORE}점</li>
                                    <li>수학 보너스: +{MATH_BONUS}점</li>
                                    <li>취약 과목: +{WEAK_WEIGHT}점</li>
                                    <li>집중 관리: +{FOCUS_WEIGHT}점</li>
                                    <li>사용자 지정: 0~20점</li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    {/* ── 하단 대형 컴포넌트: 전용 플래닝 캘린더 엔진 ── */}
                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                        <h2 className="text-lg font-bold text-slate-800 mb-4">🗓 학습 계획 달력</h2>
                        
                        {/* 달력 달 이동 네비게이션 */}
                        <div className="flex justify-center items-center space-x-6 mb-4">
                            <button onClick={() => changeMonth("prev")} className="p-1 text-slate-600 hover:font-bold">◀</button>
                            <span className="text-base font-bold text-slate-800">{currentYear}년 {currentMonth + 1}월</span>
                            <button onClick={() => changeMonth("next")} className="p-1 text-slate-600 hover:font-bold">▶</button>
                        </div>

                        {/* 요일 그리드 상단 라벨 */}
                        <div className="grid grid-cols-7 gap-1.5 text-center mb-1">
                            {WEEKDAYS.map((w, i) => (
                                <span key={w} className={`text-xs font-bold py-1 ${i === 0 ? 'text-red-500' : i === 6 ? 'text-blue-500' : 'text-slate-500'}`}>{w}</span>
                            ))}
                        </div>

                        {/* 실제 달력 코어 바디 셀 렌더링 */}
                        <div className="grid grid-cols-7 gap-2 mb-6">
                            {calendarCells.map((day, idx) => {
                                if (!day) return <div key={`empty-${idx}`} className="bg-slate-50/50 min-h-[85px] rounded-lg"></div>;
                                
                                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
                                const isSelected = selectedDate === dateStr;
                                const isToday = new Date().toISOString().split('T')[0] === dateStr;
                                
                                const todaySessions = studySessions.filter(s => s.date === dateStr);
                                const totalMin = todaySessions.reduce((acc, curr) => acc + curr.duration, 0);

                                return (
                                    <div 
                                        key={`day-${day}`}
                                        onClick={() => setSelectedDate(dateStr)}
                                        className={`min-h-[85px] p-2 border rounded-xl flex flex-col justify-between transition-all cursor-pointer ${isSelected ? 'ring-2 ring-indigo-600 border-transparent bg-[#eef2ff]' : isToday ? 'bg-[#fef9c3] border-amber-400' : 'bg-white border-slate-200 hover:border-slate-300'}`}
                                    >
                                        <span className={`text-xs font-bold ${idx % 7 === 0 ? 'text-red-500' : idx % 7 === 6 ? 'text-blue-500' : isToday ? 'text-amber-700' : 'text-slate-700'}`}>{day}</span>
                                        
                                        <div className="flex-1 space-y-1 my-1 overflow-hidden">
                                            {todaySessions.slice(0, 2).map(s => (
                                                <div key={s.id} style={{ backgroundColor: s.color + '22', color: s.color }} className="text-[10px] px-1.5 py-0.5 rounded font-bold truncate">
                                                    {s.subjectName}
                                                </div>
                                            ))}
                                        </div>

                                        {totalMin > 0 && (
                                            <div className="text-[10px] text-slate-500 font-medium flex items-center">
                                                ⏱ {Math.floor(totalMin / 60)}h{totalMin % 60}m
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>

                        {/* 세션 리스트 디테일 & 계획 추가 창 파트 */}
                        <div className="border-t border-slate-100 pt-5 space-y-4">
                            <h3 className="text-sm font-bold text-slate-800 flex items-center">📅 {selectedDate} 학습 계획 및 기록</h3>
                            
                            <div className="space-y-2">
                                {sessionsToday.length === 0 ? (
                                    <p className="text-xs text-slate-400">배치된 계획이 없습니다.</p>
                                ) : (
                                    sessionsToday.map(s => (
                                        <div key={s.id} style={{ backgroundColor: s.color + '12' }} className="flex justify-between items-center p-3 rounded-lg border border-slate-100">
                                            <span className="text-xs font-bold text-slate-800">● {s.subjectName} &nbsp;&nbsp; {s.duration}분</span>
                                            <button onClick={() => removeSession(s.id)} className="text-red-500 hover:text-red-700 text-xs px-2">✕</button>
                                        </div>
                                    ))
                                )}
                            </div>

                            {/* 하단 제어 버튼 인터페이스 슬롯 */}
                            {!showAddForm ? (
                                scores.length === 0 ? (
                                    <div className="text-center py-2 text-xs text-slate-400">먼저 상단에서 우선순위를 계산해 주세요.</div>
                                ) : (
                                    <button onClick={() => setShowAddForm(true)} className="w-full border border-dashed border-indigo-300 text-indigo-600 text-xs font-bold py-2.5 rounded-lg hover:bg-indigo-50 transition">
                                        + 학습 계획 추가
                                    </button>
                                )
                            ) : (
                                <div className="bg-[#f9fafb] p-4 rounded-xl border border-slate-200 space-y-3 max-w-md">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">과목 선택</label>
                                        <select value={formSubject} onChange={(e) => setFormSubject(e.target.value)} className="w-full border border-slate-300 rounded-lg p-2 text-xs bg-white focus:outline-none">
                                            {scores.map((sc, i) => <option key={i} value={sc.name}>{sc.name}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">학습 시간 (분)</label>
                                        <div className="flex gap-2">
                                            <input type="number" value={formDuration} onChange={(e) => setFormDuration(e.target.value)} className="w-24 border border-slate-300 rounded-lg p-2 text-xs text-center focus:outline-none" />
                                            <button onClick={applyRecommended} className="bg-[#e0e7ff] text-[#4f46e5] text-xs font-semibold px-3 py-2 rounded-lg hover:bg-indigo-100 transition">추천값 적용</button>
                                        </div>
                                    </div>
                                    <div className="flex gap-2 pt-1">
                                        <button onClick={handleAddSession} className="flex-1 bg-[#4f46e5] text-white text-xs font-bold py-2 rounded-lg hover:bg-[#4338ca] transition">추가</button>
                                        <button onClick={() => setShowAddForm(false)} className="flex-1 bg-slate-200 text-slate-700 text-xs font-semibold py-2 rounded-lg hover:bg-slate-300 transition">취소</button>
                                    </div>
                                </div>
                            )}
                        </div>

                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
