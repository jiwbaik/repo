<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 잠실고 선택과목 상담 챗봇</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: '맑은 고딕', 'Malgun Gothic', system-ui, sans-serif; }
        /* 스크롤바 커스텀 */
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div id="root" class="flex flex-col flex-1"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // ── 1. 파이썬 원본 프롬프트 및 데이터 이식 ──────────────────
        const SYSTEM_PROMPT = `당신은 잠실고등학교 1학년 학생의 2학년 선택과목 결정을 도와주는 친절한 상담사입니다.
아래의 [참고자료]를 바탕으로 정확하게 답변하세요.
반드시 과목 선택 규칙(학점 제한, 필수 선택 과목 등)을 지켜서 추천하세요.
학생의 진로와 흥미를 먼저 파악한 뒤 맞춤형 추천을 해주세요.
모르는 내용은 모른다고 솔직하게 말하세요.`;

        const CONTEXT_DATA = `
[잠실고등학교 2027학년도 선택 과목 안내]
신청 기간: 2026년 6월 1일(월) ~ 6월 5일(금)
신청 방법: 리로스쿨 → 教育과정 → 수강신청
학기별로 4과목 선택 (1, 2학기 동일과목 수강 불가)

[2학년 선택 과목 목록]
- 국어: 1학기(독서토론과 글쓰기), 2학기(문학과 영상)
- 수학: 1학기(기하), 2학기(수학과제탐구)
- 영어: 1학기(영미문학 읽기), 2학기(영어발표와 토론)
- 사회: 세계사(1학기), 동아시아 역사기행(1학기), 사회와 문화(2학기), 법과 사회(2학기), 정치(2학기), 경제(2학기), 세계시민과 지리(2학기), 기후변화와 지속가능한 세계(2학기), 현대사회와 윤리(2학기), 윤리문제 탐구(2학기)
- 과학: 물리학, 지구과학, 역학과 에너지, 화학, 물질과 에너지, 생명과학, 세포와 물질대사 (모두 1학기 개설)
- 기술·가정/정보: 정보(일반), 데이터 과학(진로)

[과목 선택 유의사항 및 규칙]
1. 학점 제한: 국어, 수학, 영어 교과 이수 학점 총합 81학점 초과 금지. 학교지정 62학점 외 최대 19학점(6과목)까지 선택 가능.
2. 필수 선택: 2학년 또는 3학년에서 반드시 기술·가정/정보/제2외국어/한문/교양 중 최소 4과목 이상 필수 선택.
3. 성적 산출: 일반선택(석차등급 1~9등급 산출), 진로/융합선택/과학사회융합/공동교육과정(성취도 A-B-C-D-E만 평가), 교양(성적 없음, 이수/미이수만 기록)
4. 진로별 추천:
 - 의대/약대/생명: 생명과학, 세포와 물질대사, 화학, 물질과 에너지
 - 공대/이공계: 물리학, 역학과 에너지, 화학, 기하, 정보, 데이터 과학
 - 사회과학/법학/경제: 경제, 법과 사회, 정치, 사회와 문화
 - 인문/어문: 독서토론과 글쓰기, 문학과 영상, 영미문학 읽기, 영어발표와 토론
 - 지구과학/환경: 지구과학, 기후변화와 지속가능한 세계
`;

        function App() {
            const [apiKey, setApiKey] = useState("");
            const [isKeySaved, setIsKeySaved] = useState(false);
            const [messages, setMessages] = useState([
                { role: "assistant", content: "안녕하세요! 잠실고등학교 2027학년도 선택과목 상담 챗봇입니다. 진로나 관심 분야, 혹은 궁금한 규칙을 말씀해 주시면 맞춤 과목을 추천해 드릴게요! 📚" }
            ]);
            const [input, setInput] = useState("");
            const [isLoading, setIsLoading] = useState(false);
            
            const chatEndRef = useRef(null);

            // 새 메시지가 올 때마다 화면 하단으로 스크롤 자동 이동
            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages]);

            // ── 2. 브라우저용 OpenAI API 호출 함수 ──────────────────
            const handleSend = async () => {
                if (!input.trim() || isLoading) return;

                const userMessage = input.trim();
                setInput("");
                
                // 화면에 사용자 메시지 먼저 추가
                const updatedMessages = [...messages, { role: "user", content: userMessage }];
                setMessages(updatedMessages);
                setIsLoading(true);

                try {
                    // LangChain의 역할을 대신할 브라우저 표준 fetch API 호출 (gpt-4o-mini 모델)
                    const response = await fetch("https://api.openai.com/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: "gpt-4o-mini",
                            temperature: 0.7,
                            messages: [
                                { role: "system", content: `${SYSTEM_PROMPT}\n\n[참고 자료]\n${CONTEXT_DATA}` },
                                ...updatedMessages.map(msg => ({ role: msg.role, content: msg.content }))
                            ]
                        })
                    });

                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error.message || "API 호출 오류가 발생했습니다.");
                    }

                    const aiResponse = data.choices[0].message.content;
                    setMessages([...updatedMessages, { role: "assistant", content: aiResponse }]);
                } catch (error) {
                    console.error(error);
                    setMessages([...updatedMessages, { role: "assistant", content: `❌ 에러가 발생했습니다: ${error.message}\nAPI 키가 올바른지 혹은 결제 만료 여부를 확인해 주세요.` }]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="flex flex-col flex-1 max-w-3xl w-full mx-auto bg-white border border-slate-200 shadow-xl md:my-6 md:rounded-2xl overflow-hidden h-[100vh] md:h-[calc(100vh-3rem)]">
                    
                    {/* 상단 타이틀 바 */}
                    <header className="bg-indigo-600 px-6 py-4 text-white flex justify-between items-center shrink-0 shadow-md">
                        <div>
                            <h1 className="text-lg font-bold flex items-center gap-2">🏫 잠실고 선택과목 상담봇</h1>
                            <p className="text-xs text-indigo-100 mt-0.5">2027학년도 교육과정 설계 솔루션</p>
                        </div>
                        {isKeySaved && (
                            <button onClick={() => setIsKeySaved(false)} className="text-xs bg-indigo-700 hover:bg-indigo-800 px-2.5 py-1 rounded-md border border-indigo-500 transition">
                                키 수정
                            </button>
                        )}
                    </header>

                    {/* API 키 설정 창 (로그인 대용) */}
                    {!isKeySaved ? (
                        <div className="flex-1 flex flex-col justify-center items-center p-6 bg-slate-50">
                            <div className="max-w-md w-full bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                                <div className="text-center">
                                    <span className="text-3xl">🔑</span>
                                    <h2 className="text-base font-bold text-slate-800 mt-2">OpenAI API Key 입력</h2>
                                    <p className="text-xs text-slate-400 mt-1">안전을 위해 입력하신 키는 서버에 저장되지 않고 브라우저에만 유지됩니다.</p>
                                </div>
                                <input 
                                    type="password" 
                                    placeholder="sk-proj-..."
                                    value={apiKey}
                                    onChange={(e) => setApiKey(e.target.value)}
                                    className="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 font-mono"
                                />
                                <button 
                                    onClick={() => apiKey.trim() ? setIsKeySaved(true) : alert("API 키를 입력해 주세요.")}
                                    className="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg hover:bg-indigo-500 transition text-sm"
                                >
                                    상담 시작하기
                                </button>
                            </div>
                        </div>
                    ) : (
                        /* ── 메인 대화창 레이아웃 ── */
                        <>
                            {/* 채팅 히스토리 영역 */}
                            <div className="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll bg-slate-50/50">
                                {messages.map((msg, i) => (
                                    <div key={i} className={`flex ${msg.role === "user" ? "justify-end" : "justify-start"}`}>
                                        <div className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-sm whitespace-pre-wrap shadow-2xs leading-relaxed
                                            ${msg.role === "user" 
                                                ? "bg-indigo-600 text-white rounded-br-none" 
                                                : "bg-white text-slate-800 border border-slate-100 rounded-bl-none"
                                            }`}
                                        >
                                            {msg.content}
                                        </div>
                                    </div>
                                ))}
                                {isLoading && (
                                    <div className="flex justify-start">
                                        <div className="bg-white border border-slate-100 rounded-2xl rounded-bl-none px-4 py-2.5 text-sm text-slate-400 shadow-2xs flex items-center gap-2">
                                            <span className="animate-pulse">●</span>
                                            <span className="animate-pulse delay-75">●</span>
                                            <span className="animate-pulse delay-150">●</span>
                                            <span className="text-xs">상담사가 답변을 생각하고 있습니다...</span>
                                        </div>
                                    </div>
                                )}
                                <div ref={chatEndRef} />
                            </div>

                            {/* 하단 입력 폼 영역 */}
                            <div className="p-4 bg-white border-t border-slate-200 flex gap-2 shrink-0">
                                <input 
                                    type="text" 
                                    placeholder={isLoading ? "답변을 기다리는 중..." : "관심 있는 진로나 과목을 물어보세요 (예: 공대 진로 과목 추천해줘)"}
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                                    disabled={isLoading}
                                    className="flex-1 border border-slate-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 disabled:bg-slate-100"
                                />
                                <button 
                                    onClick={handleSend}
                                    disabled={isLoading || !input.trim()}
                                    className="bg-indigo-600 text-white font-bold px-5 py-3 rounded-xl hover:bg-indigo-500 transition text-sm shrink-0 disabled:bg-slate-300 disabled:cursor-not-allowed"
                                >
                                    전송
                                </button>
                            </div>
                        </>
                    )}
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
